<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TNT Destruction</title>
<style>
:root{--bg:#121317;--panel:#1a1c21;--btn:#24272e;--line:#343842;--txt:#ece8df;--mut:#99a0aa;--hot:#ff7a1a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{display:flex;height:100%;width:100%}
.side{flex:none;width:196px;background:var(--panel);border-right:1px solid #000;overflow-y:auto;overflow-x:hidden;padding:0 8px 10px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.logo{position:sticky;top:0;z-index:2;background:var(--panel);margin:0 -8px 2px;padding:10px 10px 8px;font-weight:900;letter-spacing:.05em;font-size:13px;white-space:nowrap;border-bottom:1px solid #000}
.logo b{color:var(--hot)}
.logo::after{content:"";display:block;height:5px;margin-top:7px;background:repeating-linear-gradient(-45deg,#f2c200 0 7px,#111 7px 14px);border-radius:2px}
.sec h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:10px 2px 6px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 4px;background:var(--btn);border:1px solid var(--line);border-radius:7px;color:var(--txt);font:600 11px system-ui,sans-serif;cursor:pointer;min-width:0}
.tb:hover{border-color:#5a616d}
.tb.on{border-color:var(--hot);box-shadow:inset 0 0 0 1px var(--hot);background:#2d241d}
.tb canvas{width:42px;height:34px;display:block}
.tb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stage{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.bar{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;align-items:center}
.bar button{pointer-events:auto;background:rgba(18,19,23,.82);color:var(--txt);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;font:600 12px system-ui,sans-serif;cursor:pointer}
.bar button:hover{border-color:rgba(255,255,255,.4)}
.bar button.on{background:var(--hot);color:#1a0f05;border-color:var(--hot)}
.bar .sp{flex:1}
.count{font:600 11px system-ui,sans-serif;color:rgba(255,255,255,.9);text-shadow:0 1px 2px #000;padding:0 4px}
.info{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:rgba(18,19,23,.82);border:1px solid rgba(255,255,255,.1);padding:7px 12px;border-radius:9px;font-size:12px;text-align:center;pointer-events:none;color:#ddd;transition:opacity .6s}
.info.dim{opacity:0}
.info b{color:var(--hot)}
.toast{position:absolute;left:50%;top:54px;transform:translate(-50%,-6px);background:var(--hot);color:#1a0f05;font-weight:700;padding:6px 12px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;font-size:12px;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:700px){
 .app{flex-direction:column}
 .stage{order:1;flex:1}
 .side{order:2;width:100%;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid #000;padding:2px 8px 6px}
 .logo{display:none}
 .sec{flex:none}
 .sec h3{margin:4px 2px 4px}
 .grid{grid-template-columns:none;grid-auto-flow:column;grid-template-rows:auto auto;grid-auto-columns:60px}
 .tb canvas{width:34px;height:28px}
 .tb{font-size:10px}
 .bar button{padding:5px 7px;font-size:11px}
 .info{font-size:11px;bottom:8px}
}
@media (max-width:560px){.bar .t{display:none}.bar button{padding:6px 9px;font-size:14px}}

.mode{position:fixed;inset:0;display:none}
.mode.on{display:block}
.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;justify-content:safe center;flex-direction:column;gap:22px;padding:20px;overflow:auto;
 background:radial-gradient(ellipse at 50% 0%,#3a2516 0%,#16171b 60%,#0e0f12 100%)}
#menu.hide{display:none}
#menu h1{font-weight:900;font-size:clamp(34px,8vw,64px);letter-spacing:.06em;line-height:1;text-align:center;text-shadow:0 4px 0 #000}
#menu h1 b{color:var(--hot)}
#menu .stripe{width:min(420px,80vw);height:10px;border-radius:3px;background:repeating-linear-gradient(-45deg,#f2c200 0 12px,#111 12px 24px)}
#menu .sub{color:var(--mut);font-size:14px;text-align:center;max-width:520px}
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.card{width:min(280px,86vw);background:#1d1f25;border:1px solid #363a44;border-radius:14px;padding:14px;color:var(--txt);cursor:pointer;text-align:left;font:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:var(--hot);box-shadow:0 10px 30px rgba(255,122,26,.18)}
.card canvas{width:100%;height:140px;display:block;border-radius:9px;margin-bottom:12px;background:#9fd0ef}
.card .tt{font-weight:900;font-size:22px;letter-spacing:.04em}.card .tt b{color:var(--hot)}
.card p{color:var(--mut);font-size:12.5px;margin-top:5px;line-height:1.4}
.card[disabled]{opacity:.45;cursor:not-allowed;transform:none}
</style>

<script>
'use strict';
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
/* ================= AUDIO ================= */
let AC=null,master=null,noise=null,muted=false,lastBoom=0,lastGlass=0;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=.55;master.connect(comp);comp.connect(AC.destination);
 noise=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function nz(t,dur,type,f0,f1,g0,q){const s=AC.createBufferSource();s.buffer=noise;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);if(q)f.Q.value=q;
 const g=AC.createGain();g.gain.setValueAtTime(g0,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+.05);}
function sBoom(size){if(!AC||muted)return;const t=AC.currentTime;if(t-lastBoom<.05&&size<2)return;lastBoom=t;
 const dur=clamp(.5+size*.6,.5,4.5);nz(t,dur,'lowpass',900+size*500,60,clamp(.45+size*.25,.3,1.2));
 const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(28,t+dur*.6);g.gain.setValueAtTime(clamp(.5+size*.2,.4,1),t);g.gain.exponentialRampToValueAtTime(.001,t+dur*.7);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur);}
function sGlass(){if(!AC||muted)return;const t=AC.currentTime;if(t-lastGlass<.07)return;lastGlass=t;nz(t,.25,'highpass',3000,6000,.18);}
function sHiss(){if(!AC||muted)return;nz(AC.currentTime,.5,'bandpass',4000,2500,.12,1.5);}
function sPop(){if(!AC||muted)return;const t=AC.currentTime;if(t-lastBoom<.04)return;lastBoom=t;nz(t,.3,'lowpass',2500,200,.3);}
function sWhoosh(){if(!AC||muted)return;nz(AC.currentTime,1,'bandpass',600,3000,.2,2);}
function sWarp(){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(700,t+.8);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(master);o.start(t);o.stop(t+1);}


function syncSound(){for(const b of document.querySelectorAll('.sbtn'))b.textContent=muted?'🔇':'🔊';}

/* =====================================================================
   2D MODE
   ===================================================================== */
function init2D(){

const cv=document.getElementById('c'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
const CELL=18, GY=820, CX=800, MAXB=1100;
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hsh=(s,i)=>{const x=Math.sin(s*127.1+i*311.7)*43758.5453;return x-Math.floor(x);};

/* ================= MATERIALS ================= */
const MATS={
 wood:    {d:.8, hp:45, fr:.8, col:'#b07a43',dk:'#6e4524',fl:true},
 brick:   {d:1.6,hp:80, fr:.85,col:'#b4523a',dk:'#6f2d1f'},
 stone:   {d:2.2,hp:120,fr:.85,col:'#a09f95',dk:'#5c5b54'},
 concrete:{d:2,  hp:140,fr:.85,col:'#bfbbb0',dk:'#7a766d'},
 glass:   {d:1.8,hp:14, fr:.5, col:'rgba(168,214,240,.55)',dk:'#5b8ea8',glass:true},
 steel:   {d:4,  hp:320,fr:.6, col:'#6f7d8a',dk:'#363f48'},
 roof:    {d:1,  hp:50, fr:.8, col:'#97312b',dk:'#561915',fl:true},
 sand:    {d:2,  hp:110,fr:.9, col:'#d9b46c',dk:'#9b7a3d'},
};

/* ================= PHYSICS ENGINE (convex polygons, sequential impulses) ================= */
let GRAV=1000, ITERS=10, SLOP=0.3, BAUM=0.2, DT=1/60, SUB=4;
let bodies=[], nid=1, frameNo=0, needClean=false;
const arbs=new Map();
const impacts=[];
let grab=null;

function boxV(w,h){return [{x:-w/2,y:-h/2},{x:w/2,y:-h/2},{x:w/2,y:h/2},{x:-w/2,y:h/2}];}
function newBody(local,x,y,a,dens,o){
 o=o||{};
 let v=local.map(p=>({x:p.x,y:p.y})), n=v.length, A=0;
 for(let i=0;i<n;i++){const p=v[i],q=v[(i+1)%n];A+=p.x*q.y-q.x*p.y;}
 if(A<0){v.reverse();A=-A;}
 let cx=0,cy=0;
 for(let i=0;i<n;i++){const p=v[i],q=v[(i+1)%n],D=p.x*q.y-q.x*p.y;cx+=(p.x+q.x)*D;cy+=(p.y+q.y)*D;}
 cx/=3*A;cy/=3*A;A*=0.5;
 for(const p of v){p.x-=cx;p.y-=cy;}
 let I=0;
 for(let i=0;i<n;i++){const p=v[i],q=v[(i+1)%n],D=p.x*q.y-q.x*p.y;I+=D*(p.x*p.x+p.y*p.y+p.x*q.x+p.y*q.y+q.x*q.x+q.y*q.y);}
 I/=12;
 const norms=[];
 for(let i=0;i<n;i++){const p=v[i],q=v[(i+1)%n];const ex=q.x-p.x,ey=q.y-p.y,L=Math.hypot(ex,ey)||1;norms.push({x:ey/L,y:-ex/L});}
 const c=Math.cos(a),s=Math.sin(a);
 const b={id:nid++,verts:v,norms,wv:v.map(()=>({x:0,y:0})),wn:v.map(()=>({x:0,y:0})),
  x:x+c*cx-s*cy,y:y+s*cx+c*cy,a,vx:0,vy:0,av:0,area:A,static:!!o.static,sleep:false,st:0,fr:o.fr==null?.7:o.fr,gs:1,dead:false,
  x0:0,y0:0,x1:0,y1:0,w:o.w||0,h:o.h||0};
 if(b.static){b.m=Infinity;b.im=0;b.iI=0;}
 else{b.m=dens*A/324;b.im=1/b.m;b.iI=324/(dens*I);}
 updW(b);
 bodies.push(b);
 return b;
}
function updW(b){
 const c=Math.cos(b.a),s=Math.sin(b.a);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(let i=0;i<b.verts.length;i++){const p=b.verts[i],w=b.wv[i];w.x=b.x+c*p.x-s*p.y;w.y=b.y+s*p.x+c*p.y;
  if(w.x<x0)x0=w.x;if(w.x>x1)x1=w.x;if(w.y<y0)y0=w.y;if(w.y>y1)y1=w.y;
  const nn=b.norms[i],wn=b.wn[i];wn.x=c*nn.x-s*nn.y;wn.y=s*nn.x+c*nn.y;}
 b.x0=x0;b.y0=y0;b.x1=x1;b.y1=y1;
}
function wake(b){if(b.sleep){b.sleep=false;b.st=0;}}
let SEPI=0;
function maxSep(A,B){
 let best=-1e9,bi=0;const n=A.wv.length,m=B.wv.length;
 for(let i=0;i<n;i++){const nn=A.wn[i],v=A.wv[i];let mn=1e9;
  for(let j=0;j<m;j++){const q=B.wv[j];const d=nn.x*(q.x-v.x)+nn.y*(q.y-v.y);if(d<mn)mn=d;}
  if(mn>best){best=mn;bi=i;if(best>0)break;}}
 SEPI=bi;return best;
}
function clip(p0,p1,nx,ny,off,tag){
 const d0=nx*p0.x+ny*p0.y-off,d1=nx*p1.x+ny*p1.y-off,out=[];
 if(d0<=0)out.push(p0);if(d1<=0)out.push(p1);
 if(d0*d1<0){const t=d0/(d0-d1);out.push({x:p0.x+t*(p1.x-p0.x),y:p0.y+t*(p1.y-p0.y),id:tag+(d0>0?p0.id:p1.id)});}
 return out.length<2?null:out;
}
function collide(A,B){
 const sa=maxSep(A,B);if(sa>0)return null;const ia=SEPI;
 const sb=maxSep(B,A);if(sb>0)return null;const ib=SEPI;
 let R,I,ri,flip;
 if(sb>0.98*sa+0.1){R=B;I=A;ri=ib;flip=1;}else{R=A;I=B;ri=ia;flip=0;}
 const rn=R.wn[ri],rl=R.wv.length,v1=R.wv[ri],v2=R.wv[(ri+1)%rl],il=I.wv.length;
 let ii=0,mn=1e9;
 for(let k=0;k<il;k++){const d=rn.x*I.wn[k].x+rn.y*I.wn[k].y;if(d<mn){mn=d;ii=k;}}
 const i1=I.wv[ii],i2=I.wv[(ii+1)%il];
 let tx=v2.x-v1.x,ty=v2.y-v1.y;const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
 let r=clip({x:i1.x,y:i1.y,id:ii},{x:i2.x,y:i2.y,id:(ii+1)%il},-tx,-ty,-(tx*v1.x+ty*v1.y),16);if(!r)return null;
 r=clip(r[0],r[1],tx,ty,tx*v2.x+ty*v2.y,32);if(!r)return null;
 const cs=[];
 for(const p of r){const sep=rn.x*(p.x-v1.x)+rn.y*(p.y-v1.y);
  if(sep<=1)cs.push({x:p.x-rn.x*sep*0.5,y:p.y-rn.y*sep*0.5,sep,id:ri*256+p.id+flip*8192,Pn:0,Pt:0,isNew:true});}
 if(!cs.length)return null;
 return {nx:flip?-rn.x:rn.x,ny:flip?-rn.y:rn.y,cs};
}
function ovlM(a,b,m){return a.x0-m<=b.x1&&a.x1+m>=b.x0&&a.y0-m<=b.y1&&a.y1+m>=b.y0;}
function ovl(a,b){return a.x0<=b.x1&&a.x1>=b.x0&&a.y0<=b.y1&&a.y1>=b.y0;}
function keyOf(a,b){return a.id<b.id?a.id*1e7+b.id:b.id*1e7+a.id;}
function touchArb(k){const ar=arbs.get(k);if(ar){ar.stamp=frameNo;ar.active=false;}}
function narrow(a,b){
 if(a.id>b.id){const t=a;a=b;b=t;}
 const k=a.id*1e7+b.id;
 const m=collide(a,b);if(!m)return;
 let ar=arbs.get(k);
 let fresh=false;
 if(!ar){ar={a,b,cs:[],nx:0,ny:0,stamp:0,active:true};arbs.set(k,ar);fresh=true;}
 ar.fresh=fresh;
 const old=ar.cs;
 for(const c of m.cs){let best=null,bd=6.25;for(const o of old){if(o.used)continue;const dx=o.x-c.x,dy=o.y-c.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=o;}}
  if(best){best.used=true;c.Pn=best.Pn;c.Pt=best.Pt;c.isNew=false;}}
 ar.cs=m.cs;ar.nx=m.nx;ar.ny=m.ny;ar.stamp=frameNo;ar.active=true;ar.fr=Math.sqrt(a.fr*b.fr);
 // waking: a fast awake body hitting a sleeping one wakes it
 if(a.sleep!==b.sleep&&!a.static&&!b.static){const W=a.sleep?b:a,S=a.sleep?a:b;
  if(W.vx*W.vx+W.vy*W.vy>625||Math.abs(W.av)>0.4)wake(S);}
 if((a.sleep||a.static)&&(b.sleep||b.static))ar.active=false;
}
const grid=new Map();
function broad(){
 grid.clear();
 const statics=[];
 for(const b of bodies){
  if(b.att||b.dead)continue;
  if(b.static){statics.push(b);continue;}
  const gx0=Math.floor(b.x0/80),gx1=Math.floor(b.x1/80),gy0=Math.floor(b.y0/80),gy1=Math.floor(b.y1/80);
  if(gx1-gx0>20||gy1-gy0>20)continue;

function applyImp(ar,c,Px,Py){

function preStep(ar,inv){

const parts=[];const MAXP=2800;

function updParts(dt){

   parts[i]=parts[parts.length-1];parts.pop();continue;}
  const dr=Math.pow(p.drag,k);p.vx*=dr;p.vy=p.vy*dr+p.g*k;p.x+=p.vx*k;p.y+=p.vy*k;p.size+=p.grow*k;

  if(p.y>GY&&(p.kind==='chip'||p.kind==='spark'||p.kind==='nap')){p.y=GY;p.vy*=-0.25;p.vx*=0.6;if(p.kind==='nap'){p.vx*=0.3;p.g=0;p.vy=0;}}
  if(p.kind==='nap'){
   if(Math.random()<k*.5)addP('fire',p.x+rnd(-3,3),p.y-2,rnd(-.3,.3),rnd(-1.6,-.6),rnd(.3,.7),rnd(5,10),{g:-.03,drag:.94});
   if(!p.stuck&&(frameNo+i)%4===0){const b=pickAt(p.x,p.y);if(b){ignite(b);p.vx=p.vy=0;p.g=0;p.stuck=b;}}
   if(p.stuck){if(p.stuck.dead){p.stuck=null;p.g=.32;}else{p.x+=p.stuck.vx*dt;p.y+=p.stuck.vy*dt;}}

let slow=false,paused=false,simT=0,c4Queue=[];

 const sub=awake>650?2:awake>380?3:SUB;

   if(S.kind==='block'&&sp>520){const ratio=O.static?2:Math.sqrt(clamp(O.m/S.m,.25,4));damage(S,(sp/60-8.5)*4.5*ratio);}

    const c=Math.cos(b.a),s=Math.sin(b.a),fx=b.x+s*(b.h/2+3),fy=b.y-c*(b.h/2+3);
    if(Math.random()<.8)addP('spark',fx,fy,rnd(-1.5,1.5),rnd(-2.5,-.5),rnd(.15,.4),2,{g:.15,col:'#ffcf6a'});
    if(b.fuseLeft<=0)det.push(b);}
  }else if(b.kind==='block'&&b.burn>0){
   b.burn+=dt;wake(b);
   const sz=Math.sqrt(b.w*b.h)/CELL;
   if(Math.random()<dt*14*sz)addP('fire',b.x+rnd(-b.w/2,b.w/2),b.y+rnd(-b.h/2,b.h/2),rnd(-.4,.4),rnd(-1.8,-.6),rnd(.3,.8),rnd(6,11)*Math.min(1.6,sz),{g:-.04,drag:.93});
   if(Math.random()<dt*2.5)addP('smoke',b.x,b.y-b.h/2,rnd(-.3,.3),rnd(-1,-.4),rnd(1.5,3),rnd(8,14),{grow:.3,g:-.02,col:'#3e3a36',drag:.97});
   if(b.burn%0.5<dt){for(const o of regionHits(b.x0-6,b.y0-8,b.x1+6,b.y1+4,b)){if(o.kind==='block'&&Math.random()<.3)ignite(o);else if(o.kind==='ex'&&!EX[o.ex].remote)light(o,undefined,true);}}
   damage(b,6.5*dt);
  }
 }
 for(const b of det)detonate(b);
 // black holes
 for(let i=holes.length-1;i>=0;i--){const h=holes[i];h.t+=dt;const R=650,str=Math.min(1,h.t/0.7);
  for(const b of bodies){if(b.dead||b.static)continue;const dx=h.x-b.x,dy=h.y-b.y,dd=Math.hypot(dx,dy)||1;if(dd>R)continue;

   wake(b);if(b.att)detach(b);const f=1-dd/R,a=(3600*f*f+500)*str;

  for(let j=0;j<4;j++){addP('fire',e.x+rnd(-28,28),rnd(capY,GY),rnd(-.3,.3),rnd(-4,-2),rnd(.5,1),rnd(14,26),{g:-.02,drag:.97});}
  for(let j=0;j<5;j++){const a=rnd(0,6.283);addP(Math.random()<.45?'fire':'smoke',e.x+Math.cos(a)*spread*rnd(.2,1),capY+Math.sin(a)*spread*.35,Math.cos(a)*rnd(.5,2),rnd(-1,.2),rnd(1,2.4),rnd(24,48),{g:-.01,drag:.97,grow:.3,col:Math.random()<.5?'#5a4b40':'#7b6a5c'});}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function texture(c,b,mat,w,h,seed){

 switch(mat){
 case 'wood':case 'roof':{c.strokeStyle=mat==='wood'?'rgba(70,40,15,.35)':'rgba(40,5,5,.35)';c.beginPath();
  if(w>=h){const n=Math.max(1,Math.round(h/7));for(let i=1;i<=n;i++){const y=-hh+h*i/(n+1);c.moveTo(-hw+2,y);c.lineTo(hw-2,y+(hsh(seed,i)-.5)*2);}}
  else{const n=Math.max(1,Math.round(w/7));for(let i=1;i<=n;i++){const x=-hw+w*i/(n+1);c.moveTo(x,-hh+2);c.lineTo(x+(hsh(seed,i)-.5)*2,hh-2);}}
  c.stroke();if(mat==='wood'&&w>40){c.fillStyle='rgba(40,25,10,.6)';c.fillRect(-hw+3,-1,2,2);c.fillRect(hw-5,-1,2,2);}break;}
 case 'brick':{c.strokeStyle='rgba(225,200,170,.55)';c.beginPath();
  const rows=Math.max(1,Math.round(h/9));for(let i=1;i<rows;i++){const y=-hh+h*i/rows;c.moveTo(-hw,y);c.lineTo(hw,y);}
  for(let i=0;i<rows;i++){const y0=-hh+h*i/rows,y1=y0+h/rows;const bw=18,off=(i%2)*bw/2;for(let x=-hw+off+bw/2;x<hw-1;x+=bw){if(x>-hw+1){c.moveTo(x,y0);c.lineTo(x,y1);}}}
  c.stroke();break;}
 case 'stone':case 'sand':{c.fillStyle='rgba(255,255,255,.14)';c.fillRect(-hw,-hh,w,2);c.fillRect(-hw,-hh,2,h);c.fillStyle='rgba(0,0,0,.12)';c.fillRect(-hw,hh-2,w,2);
  c.strokeStyle='rgba(0,0,0,.18)';c.beginPath();const x=(hsh(seed,1)-.5)*w*.6,y=(hsh(seed,2)-.5)*h*.6;c.moveTo(x,y);c.lineTo(x+(hsh(seed,3)-.5)*8,y+(hsh(seed,4)-.5)*8);c.stroke();break;}
 case 'concrete':{c.fillStyle='rgba(0,0,0,.13)';const n=Math.max(2,(w*h/120)|0);for(let i=0;i<n&&i<14;i++)c.fillRect((hsh(seed,i)-.5)*(w-3),(hsh(seed,i+20)-.5)*(h-3),1.5,1.5);break;}
 case 'glass':{c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1.5;c.beginPath();c.moveTo(-hw+w*.25,hh-3);c.lineTo(-hw+w*.6,-hh+3);c.stroke();break;}
 case 'steel':{c.fillStyle='rgba(255,255,255,.12)';if(w>=h){c.fillRect(-hw,-hh+2,w,2);}else c.fillRect(-hw+2,-hh,2,h);c.fillStyle='rgba(20,25,30,.6)';
  if(w>8&&h>8){const pts=w>=h?[[-hw+4,0],[hw-4,0]]:[[0,-hh+4],[0,hh-4]];for(const [x,y] of pts){c.beginPath();c.arc(x,y,1.4,0,6.283);c.fill();}}break;}
 }
}

}

function house(p,W,D,floors,fh,o){
 for(let f=0;f<floors;f++){const y0=f*fh;
  for(let y=y0;y<y0+fh-1;y++){const ry=y-y0;
   for(let x=0;x<W;x++)for(let z=0;z<D;z++){
    const ex=x===0||x===W-1,ez=z===0||z===D-1;if(!ex&&!ez)continue;const corner=ex&&ez;
    if(f===0&&o.door&&z===0&&x>=o.door[0]&&x<=o.door[1]&&ry<o.doorH)continue;
    const u=ez?x:z,len=ez?W:D;const isCol=corner||(o.colEvery&&u%o.colEvery===0);
    let m=o.wall;
    if(isCol&&o.col)m=o.col;

    if(m)p(x,y,z,m,o.hm);}}
  for(let x=0;x<W;x++)for(let z=0;z<D;z++)p(x,y0+fh-1,z,o.slab,o.hm);
 }

}

   const o=spawnDeb(px+x,py+y,pz+z,m,s,px*inv*sp,py*inv*sp+sp*.45+rnd(0,3),pz*inv*sp,id);if(o&&isB)o.burn=.01;}

 }

 else{const c=ic.getContext('2d');ic.width=84;ic.height=68;c.scale(2,2);c.font='22px system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(td.emoji,21,18);}
 const sp=document.createElement('span');sp.textContent=td.name;b.append(ic,sp);b.title=td.name;b.onclick=()=>select(td);groups[td.kind].appendChild(b);btns.push([td,b]);}
const infoEl=$('info3'),toastEl=$('toast3');let infoT=0,toastT=0;
function showInfo(h,ms){infoEl.innerHTML=h;infoEl.classList.remove('dim');clearTimeout(infoT);infoT=setTimeout(()=>infoEl.classList.add('dim'),ms||6000);}
function toast3(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),1800);}
function select(td){tool=td;for(const [t,b] of btns)b.classList.toggle('on',t===td);showInfo(td.info);}
function lightAll(){let n=0;for(const o of objs)if(!o.dead&&o.kind==='ex'&&!EX3[o.ex].remote&&!o.lit){light(o,undefined,true);n++;}if(n){sHiss();toast3(`Lit ${n} explosive${n>1?'s':''}!`);}else toast3('Nothing to light — place some explosives first');}
function detC4(){let n=0;for(const o of objs)if(!o.dead&&o.ex==='c4'){c4Q.push({o,t:n*.07});n++;}if(!n)toast3('No C4 placed');}
function clearAll(){for(const id of [...solids])delV(id);integ=false;objs=[];parts.length=0;burning.clear();holes.length=0;emitters.length=0;scorch.length=0;c4Q.length=0;whiteout=0;heat=0;dirty=true;}
$('b3Light').onclick=()=>{initAudio();lightAll();};
$('b3C4').onclick=()=>{initAudio();detC4();};
$('b3Slow').onclick=()=>{slow=!slow;$('b3Slow').classList.toggle('on',slow);};
$('b3Pause').onclick=()=>{paused=!paused;$('b3Pause').classList.toggle('on',paused);$('b3Pause').innerHTML=paused?'▶<span class="t"> Play</span>':'⏸<span class="t"> Pause</span>';};
$('b3Debris').onclick=()=>{for(const o of objs)if(o.kind==='deb')o.dead=true;parts.length=0;};
$('b3Clear').onclick=clearAll;
$('b3Cam').onclick=resetCam;
$('b3Sound').onclick=()=>{muted=!muted;initAudio();syncSound();};
window.addEventListener('keydown',e=>{if(!running)return;const k=e.key.toLowerCase();
 if(k===' '){e.preventDefault();initAudio();lightAll();}else if(k==='c'){initAudio();detC4();}else if(k==='s')$('b3Slow').click();else if(k==='p')$('b3Pause').click();
 else if(/^[1-9]$/.test(k)){const t=toolDefs.filter(t=>t.kind==='ex')[+k-1];if(t)select(t);}
 else if(k==='arrowleft')cam.yaw+=.08;else if(k==='arrowright')cam.yaw-=.08;else if(k==='arrowup')cam.dist=clamp(cam.dist*.92,12,170);else if(k==='arrowdown')cam.dist=clamp(cam.dist*1.08,12,170);});

/* ---------- start ---------- */
spawnB('house',OX,OZ);spawnB('shack',OX-24,OZ+6);spawnB('apart',OX+22,OZ-6);
newEx('tnt',.5,1+EX3.tnt.r,.5);
select(toolDefs[0]);
let last=performance.now(),acc=0;
function loop(now){if(!running){raf=0;return;}const rdt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused){acc+=rdt;let n=0;while(acc>=STEP&&n<2){gameStep();acc-=STEP;n++;}if(n===2)acc=0;}
 render(rdt);if(frame%15===0)$('count3').textContent=`${solids.size} blocks · ${objs.length} debris`;
 raf=requestAnimationFrame(loop);}
window.__s3={objs:()=>objs,solids,newEx,spawnB,light,lightAll,gameStep,EX3,cam,detonate,explode,select,toolDefs,act:(x,y)=>act(x,y)};
let firstShow=true;return{show(){running=true;resize();if(firstShow&&W<H){cam.dist=95;}firstShow=false;last=performance.now();showInfo('Drag to orbit · right-drag or two fingers to pan · scroll or pinch to zoom. Click to place, click again to light. Try the TNT in the house!',12000);if(!raf)raf=requestAnimationFrame(loop);},hide(){running=false;}};
}

/* ================= MENU ================= */
const modes={},inited={};let cur=null;
function openMode(m){
 document.getElementById('menu').classList.add('hide');
 for(const id of ['app','app3'])document.getElementById(id).parentElement.classList.remove('on');
 document.getElementById(m==='2d'?'app':'app3').parentElement.classList.add('on');
 if(!inited[m]){inited[m]=1;try{modes[m]=m==='2d'?init2D():init3D();}catch(e){console.error(e);modes[m]=null;}
  if(!modes[m]){alert('Sorry — 3D mode needs WebGL 2, which this browser does not support.');showMenu();return;}}
 if(cur&&cur!==modes[m])cur.hide();cur=modes[m];syncSound();requestAnimationFrame(()=>cur.show());
}
function showMenu(){if(cur)cur.hide();cur=null;document.getElementById('menu').classList.remove('hide');for(const id of ['app','app3'])document.getElementById(id).parentElement.classList.remove('on');drawPreviews();}
document.getElementById('go2d').onclick=()=>{initAudio();openMode('2d');};
document.getElementById('go3d').onclick=()=>{initAudio();openMode('3d');};
for(const b of document.querySelectorAll('.mbtn'))b.onclick=showMenu;
if(!document.createElement('canvas').getContext('webgl2')){const g=document.getElementById('go3d');g.disabled=true;g.querySelector('p').textContent='Needs WebGL 2, which this browser does not support.';}
function drawPreviews(){
 // 2D preview: side view
 let c=document.getElementById('pv2d').getContext('2d');const W=560,H=280;
 let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#64aee6');g.addColorStop(1,'#d2ebf8');c.fillStyle=g;c.fillRect(0,0,W,H);
 c.fillStyle='#86b884';c.beginPath();c.moveTo(0,230);for(let x=0;x<=W;x+=20)c.lineTo(x,200-18*Math.sin(x*.012)-10*Math.sin(x*.03));c.lineTo(W,230);c.fill();
 c.fillStyle='#6e4d2e';c.fillRect(0,230,W,50);c.fillStyle='#5ea33f';c.fillRect(0,228,W,8);
 const cell=16;
 const box=(x,y,w,h,f,s)=>{c.fillStyle=f;c.fillRect(x,y,w,h);c.strokeStyle=s;c.lineWidth=1;c.strokeRect(x+.5,y+.5,w-1,h-1);};
 for(let r=0;r<4;r++)for(let col=0;col<7;col++){const win=r%3===1&&(col===1||col===2||col===4||col===5);box(60+col*cell,228-(r+1)*cell,cell,cell,win?'#a8d6f0':'#b4523a',win?'#5b8ea8':'#6f2d1f');}
 for(let k=0;k<4;k++)for(let col=k;col<7-k;col++)box(60+col*cell,228-(5+k)*cell,cell,cell,'#97312b','#561915');
 for(let r=0;r<9;r++)for(let col=0;col<5;col++){const win=col===1||col===3;box(400+col*cell,228-(r+1)*cell,cell,cell,win?'#a8d6f0':'#bfbbb0',win?'#5b8ea8':'#7a766d');}
 for(let i=0;i<14;i++){c.save();c.translate(250+Math.cos(i)*60+i*3,150-Math.sin(i*1.7)*50);c.rotate(i);box(-7,-5,14,10,i%2?'#b07a43':'#b4523a','#432');c.restore();}
 let rg=c.createRadialGradient(260,175,0,260,175,70);rg.addColorStop(0,'rgba(255,250,210,1)');rg.addColorStop(.35,'rgba(255,170,50,.9)');rg.addColorStop(1,'rgba(255,90,20,0)');c.fillStyle=rg;c.beginPath();c.arc(260,175,70,0,7);c.fill();
 box(300,212,16,16,'#cf2a1f','#5a0f0a');c.fillStyle='#f2ede1';c.fillRect(300,217,16,6);
 // 3D preview: isometric voxels
 c=document.getElementById('pv3d').getContext('2d');
 g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5799d8');g.addColorStop(1,'#cfe3f1');c.fillStyle=g;c.fillRect(0,0,W,H);
 const S=11,ox=280,oy=200;const pr=(x,y,z)=>[ox+(x-z)*S*.866,oy+(x+z)*S*.5-y*S];
 const face=(pts,col)=>{c.beginPath();pts.forEach((p,i)=>{const q=pr(...p);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});c.closePath();c.fillStyle=col;c.fill();};
 face([[-14,0,-14],[14,0,-14],[14,0,14],[-14,0,14]],'#5c8f3c');
 const cubes=[];const sh=(rgb,f)=>`rgb(${rgb[0]*f|0},${rgb[1]*f|0},${rgb[2]*f|0})`;
 const add=(x,y,z,rgb)=>cubes.push([x,y,z,rgb]);
 for(let y=0;y<10;y++)for(let x=-9;x<-3;x++)for(let z=-3;z<3;z++){if(x>-9&&x<-4&&z>-3&&z<2)continue;const glass=(y%3===1)&&((x+z)%2===0);add(x,y,z,glass?[168,214,240]:[190,186,175]);}
 for(let y=0;y<5;y++)for(let x=2;x<9;x++)for(let z=-2;z<4;z++){if(x>2&&x<8&&z>-2&&z<3)continue;if(y>=1&&y<=3&&z===3&&x>=4&&x<=6)continue;add(x,y,z,[180,82,58]);}
 for(let t=0;t<4;t++)for(let x=1;x<10;x++){add(x,5+t,-2+t,[151,49,43]);add(x,5+t,3-t,[151,49,43]);}
 cubes.sort((a,b)=>(a[0]+a[2]+a[1]*.01)-(b[0]+b[2]+b[1]*.01)||a[1]-b[1]);
 for(const [x,y,z,rgb] of cubes){face([[x,y+1,z],[x+1,y+1,z],[x+1,y+1,z+1],[x,y+1,z+1]],sh(rgb,1));face([[x+1,y,z],[x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1]],sh(rgb,.78));face([[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]],sh(rgb,.62));}
 for(let i=0;i<16;i++){const p=pr(3+Math.cos(i*2.1)*4,9+Math.sin(i*1.3)*3+i*.3,6+Math.sin(i)*3);c.save();c.translate(p[0],p[1]);c.rotate(i);c.fillStyle=i%2?'#b4523a':'#97312b';c.fillRect(-5,-5,10,10);c.restore();}
 const fp=pr(5,3,1);rg=c.createRadialGradient(fp[0],fp[1],0,fp[0],fp[1],60);rg.addColorStop(0,'rgba(255,250,210,1)');rg.addColorStop(.35,'rgba(255,170,50,.9)');rg.addColorStop(1,'rgba(255,90,20,0)');c.fillStyle=rg;c.beginPath();c.arc(fp[0],fp[1],60,0,7);c.fill();
}
drawPreviews();
